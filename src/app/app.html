<div class="min-h-screen">
  <p-toolbar styleClass="border-noround shadow-1 bg-white px-4 py-3 mb-4">
    <ng-template #start>
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <i class="pi pi-graduation-cap" style="font-size: 1.75rem; color: #0284c7;"></i>
        <div>
          <h2 style="margin: 0; font-size: 1.25rem; color: #0f172a;">Sistema de Gestión Estudiantil</h2>
          <small style="color: #64748b;">Módulo de Registro Académico</small>
        </div>
      </div>
    </ng-template>
    <ng-template #end>
      <p-button label="API Conectada" icon="pi pi-check-circle" severity="success" [outlined]="true" size="small" />
    </ng-template>
  </p-toolbar>

  <main style="max-width: 1200px; margin: 0 auto; padding: 0 1.5rem;">
    <app-estudiantes />
  </main>
</div>
